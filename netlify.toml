# Netlify build settings. Netlify detects Next.js and adds its free Next.js runtime automatically.
# Deploy steps: see DEPLOY.md. Secrets go in Netlify's site settings, never in this file.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # DATA_BACKEND ("sheets") isn't a secret, and the word appears all through the code,
  # so Netlify's secret scan shouldn't treat it as one. Real secrets are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "DATA_BACKEND,OWNER_NAME"

# Scheduled functions (the daily job) live here. See netlify/functions/daily.mts.
[functions]
  directory = "netlify/functions"
